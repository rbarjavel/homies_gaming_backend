name: Build Godot Release Binary

on:
  push:
    tags:
      - 'g*'

env:
  GODOT_VERSION: 4.4.1
  EXPORT_NAME: homies-video-player
  PROJECT_PATH: client/godot_project/homies-video-player

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.4.1
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cd /tmp
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release --rendering-method="compatibility" "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release --rendering-method="compatibility" "Linux" "$EXPORT_DIR/linux/$EXPORT_NAME.x86_64"

      - name: Create Archives
        run: |
          cd build
          zip -r ${EXPORT_NAME}-windows.zip windows
          tar -czf ${EXPORT_NAME}-linux.tar.gz linux
          ls -la *.zip *.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/*.zip
            build/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
